name: Actualizar Parche Free Fire Automático

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Actualizar Meta Parche en JSON
        run: |
          FECHA=$(date +'%Y-%m-%d')
          echo "{
            \"version_parche\": \"Meta Actualizado Auto ($FECHA)\",
            \"factorGeneral\": 1.00,
            \"factorRedDot\": 1.00,
            \"factorScopes\": 1.00,
            \"mensajeParche\": \"Sincronización automática activa\"
          }" > parche_meta.json

      - name: Guardar Cambios en GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add parche_meta.json
          git commit -m "Actualización automática de versión de parche" || exit 0
          git push
