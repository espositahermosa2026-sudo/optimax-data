name: Actualizar Parche Free Fire Automático

on:
  schedule:
    - cron: '0 3 * * *' # Se ejecuta todos los días
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v3

      - name: Obtener Versión de Google Play y Actualizar JSON
        run: |
          # Extrae la versión visible en la Play Store o genera la etiqueta
          VERSION_TIENDA=$(curl -s "https://play.google.com/store/apps/details?id=com.dts.freefireth&hl=es" | grep -oP '\[\[\["\K[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "Oficial")
          FECHA=$(date +'%Y-%m-%d')
          
          echo "{
            \"version_parche\": \"Meta Parche $VERSION_TIENDA ($FECHA)\",
            \"factorGeneral\": 1.00,
            \"factorRedDot\": 1.00,
            \"factorScopes\": 1.00,
            \"mensajeParche\": \"Servidor Sincronizado en Vivo\"
          }" > parche_meta.json

      - name: Guardar Cambios en GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add parche_meta.json
          git commit -m "Auto-update parche version" || exit 0
          git push
